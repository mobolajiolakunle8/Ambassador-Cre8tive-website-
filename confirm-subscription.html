<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Confirm your Ambassador Cre8tive creative notes subscription." />
  <title>Confirm subscription — Ambassador Cre8tive</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="unsubscribe-page subscription-page">
    <a class="brand unsubscribe-page__brand" href="index.html" aria-label="Ambassador Cre8tive home"><span class="brand-mark" aria-hidden="true">AC</span><span class="brand-name"><strong>Ambassador</strong><em>Cre8tive</em></span></a>
    <section class="unsubscribe-card" aria-labelledby="confirmation-title">
      <span class="eyebrow eyebrow--lime">Creative notes</span>
      <h1 id="confirmation-title">Confirm your<br /><em>subscription.</em></h1>
      <p data-confirmation-copy>Confirm your email address to receive occasional Ambassador Cre8tive creative notes.</p>
      <form data-confirmation-form hidden>
        <button class="button button--lime" type="submit">Confirm subscription <span aria-hidden="true">↗</span></button>
      </form>
      <p class="unsubscribe-status" data-confirmation-status aria-live="polite"></p>
      <a class="text-link unsubscribe-back" href="index.html">Return to the website <span aria-hidden="true">↗</span></a>
    </section>
  </main>
  <script src="confirm-subscription.js"></script>
</body>
</html>
