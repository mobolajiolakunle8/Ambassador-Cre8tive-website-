<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Manage your Ambassador Cre8tive email subscription." />
  <title>Unsubscribe — Ambassador Cre8tive</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="unsubscribe-page">
    <a class="brand unsubscribe-page__brand" href="index.html" aria-label="Ambassador Cre8tive home"><span class="brand-mark" aria-hidden="true">AC</span><span class="brand-name"><strong>Ambassador</strong><em>Cre8tive</em></span></a>
    <section class="unsubscribe-card" aria-labelledby="unsubscribe-title">
      <span class="eyebrow eyebrow--lime">Email preferences</span>
      <h1 id="unsubscribe-title">Manage your<br /><em>subscription.</em></h1>
      <p data-unsubscribe-copy>Confirm that you would like to stop receiving Ambassador Cre8tive creative notes at this email address.</p>
      <form data-unsubscribe-form hidden>
        <button class="button button--lime" type="submit">Unsubscribe <span aria-hidden="true">↗</span></button>
      </form>
      <p class="unsubscribe-status" data-unsubscribe-status aria-live="polite"></p>
      <a class="text-link unsubscribe-back" href="index.html">Return to the website <span aria-hidden="true">↗</span></a>
    </section>
  </main>
  <script src="unsubscribe.js"></script>
</body>
</html>
